[build-system]
requires = ["hatchling", "hatch-node-build>=1.1.0"]
build-backend = "hatchling.build"

[project]
name = "snakeviz"
authors = [
    {name = "Matt Davis", email = "jiffyclub@gmail.com"},
]
description = "A web-based viewer for Python profiler output"
readme = "README.rst"
license = { file = "LICENSE.txt" }
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: JavaScript",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development"
]

[project.scripts]
snakeviz = "snakeviz.cli:main"

[project.urls]
homepage = "https://jiffyclub.github.io/snakeviz/"
repository = "https://github.com/jiffyclub/snakeviz.git"
changelog = "https://github.com/jiffyclub/snakeviz/blob/master/CHANGES.rst"

[tool.hatch.version]
source = "code"
path = "snakeviz/__about__.py"

[tool.hatch.build.hooks.node-build]
bundle-dir = "templates"
inline-bundle = true